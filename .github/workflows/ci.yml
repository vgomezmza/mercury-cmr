name: CI - Mercury CAD CRM

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Pruebas Vitest & Compilación Next.js
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Instalar dependencias
        run: npm install

      - name: 🔍 Verificación Estática de Tipos (TypeScript)
        run: npx tsc --noEmit

      - name: 🧪 Ejecutar Suite Completa de Pruebas (Vitest - 41 tests)
        run: npm run test

      - name: 🏗️ Compilar Producción (Next.js Build)
        run: npm run build
