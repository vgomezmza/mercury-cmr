name: Publicar Mercury CRM en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Permissions needed to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: 🧪 Pruebas Vitest & 🏗️ Compilacion Next.js
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Instalar dependencias
        run: npm install

      - name: ⚙️ Generar cliente Prisma
        run: npx prisma generate

      - name: 🔍 Verificacion de tipos (TypeScript)
        run: npx tsc --noEmit

      - name: 🧪 Ejecutar suite de pruebas (Vitest - 41 tests)
        run: npm run test

      - name: 🏗️ Compilar y exportar sitio estatico para GitHub Pages
        env:
          NEXT_PUBLIC_BASE_PATH: "/mercury-cmr"
        run: npm run build

      - name: 📤 Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: 🚀 Desplegar en GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Desplegar sitio
        id: deployment
        uses: actions/deploy-pages@v4
